<script>
// защита от встраивания чужим сайтом (кликджекинг) — только на собственном домене
if (/github\.io$/.test(location.hostname) && window.top !== window.self) { try { window.top.location = window.self.location; } catch(e) { document.documentElement.innerHTML = ''; } }
// ============================================================
// ЯДРО РАСЧЁТА. Источники указаны у каждой таблицы/формулы.
// ============================================================
const SPRK = 'СП РК 2.04-105-2012';
const NOM = [20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
const I0 = NOM.indexOf(100);              // индекс полосы 100 Гц
const BANDS = NOM.slice(I0, I0 + 16);     // 100…3150 Гц
// Границы 1/3-октавных полос — СП РК 2.04-105-2012, табл. Б.2
const B2 = {50:[45,56],63:[57,70],80:[71,88],100:[89,111],125:[112,140],160:[141,176],200:[177,222],250:[223,280],315:[281,353],400:[354,445],500:[446,561],630:[562,707],800:[708,890],1000:[891,1122],1250:[1123,1414],1600:[1415,1782],2000:[1783,2244],2500:[2245,2828],3150:[2829,3563],4000:[3564,4489],5000:[4490,5657]};
function bandIdx(f){
  for (let i = 0; i < NOM.length; i++){
    const n = NOM[i]; const b = B2[n] || [n*Math.pow(2,-1/6), n*Math.pow(2,1/6)];
    if (f <= b[1] + 0.5) return i;
  }
  return NOM.length - 1;
}
const nomOf = i => NOM[Math.max(0, Math.min(NOM.length-1, Math.round(i)))];
const r05 = x => Math.round(x*2)/2;
const fmt = (x, d=1) => { if (x === null || x === undefined || isNaN(x)) return '—'; const v = Math.round(x*Math.pow(10,d))/Math.pow(10,d); return String(v).replace('.', ','); };
function interp(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  const n = tab.length; if (x >= tab[n-1][0]) return tab[n-1][1];
  for (let i = 1; i < n; i++) if (x <= tab[i][0]) { const [x0,y0] = tab[i-1], [x1,y1] = tab[i]; return y0 + (y1-y0)*(x-x0)/(x1-x0); }
}

// Оценочные кривые — СП РК 2.04-105-2012, табл. 4, строки 1 и 2
const CURVE_R = [33,36,39,42,45,48,51,52,53,54,55,56,56,56,56,56];
const CURVE_L = [62,62,62,62,62,62,61,60,59,58,57,54,51,48,45,42];

// Индекс Rw — СП РК 2.04-105-2012, п. 4.1.21 (неблагоприятные — вниз)
function indexRw(R){
  let best = null;
  for (let s = -40; s <= 40; s++){
    const dev = R.map((r,i) => Math.max(0, CURVE_R[i] + s - r)); const sum = dev.reduce((a,b)=>a+b,0);
    if (sum <= 32) best = {s, sum, dev, shifted: CURVE_R.map(c=>c+s)};
  }
  const dev0 = R.map((r,i) => Math.max(0, CURVE_R[i] - r));
  return {...best, Rw: 52 + best.s, dev0, sum0: dev0.reduce((a,b)=>a+b,0)};
}
// Индекс Lnw — СП РК 2.04-105-2012, п. 4.1.22 (неблагоприятные — вверх)
function indexLnw(L){
  for (let s = -40; s <= 40; s++){
    const dev = L.map((l,i) => Math.max(0, l - (CURVE_L[i] + s))); const sum = dev.reduce((a,b)=>a+b,0);
    if (sum <= 32) return {s, sum, dev, shifted: CURVE_L.map(c=>c+s), Lnw: 60 + s};
  }
}

// ---------- M1: массивная однослойная, СП РК прил. Б.1.2 ----------
// fB — табл. Б.1 (h в мм), промежуточные γ интерполируются
const FB_TAB = [[600,40000],[800,39000],[1000,37000],[1200,35000],[1400,33000],[1600,31000],[1800,29000]];
function calcMassive({m, g, hmm, K, label}){
  const steps = [], notes = [];
  const coef = interp(FB_TAB, g); const fB = coef/hmm; const iB = bandIdx(fB);
  const me = K*m; const RBraw = 20*Math.log10(me) - 12; const RB = r05(RBraw);
  steps.push(`Поверхностная плотность: m = ${fmt(m,1)} кг/м²; K = ${fmt(K,2)} (${SPRK}, табл. Б.3); mэ = K·m = ${fmt(me,1)} кг/м² (ф. Б.2).`);
  steps.push(`Абсцисса точки B (табл. Б.1): fB = ${Math.round(coef)}/${fmt(hmm,1)} = ${Math.round(fB)} Гц → по табл. Б.2 принимаем fB = ${nomOf(iB)} Гц.`);
  steps.push(`Ордината точки B (ф. Б.1): RB = 20·lg mэ − 12 = 20·lg ${fmt(me,1)} − 12 = ${fmt(RBraw,2)} ≈ ${fmt(RB)} дБ.`);
  const iC = iB + (65 - RB)/2;
  steps.push(`Из точки B влево — горизонталь BA, вправо — отрезок BC с наклоном 6 дБ на октаву до RC = 65 дБ (${SPRK}, п. Б.1.2). Точка C на частоте ≈ ${Math.round(100*Math.pow(2,(iC-I0)/3))} Гц${iC > I0+15 ? ' — за пределами нормируемого диапазона, отрезок CD отсутствует' : ''}.`);
  if (m < 100 || m > 800) notes.push(`m = ${fmt(m,0)} кг/м² вне диапазона 100–800 кг/м², для которого применима методика п. Б.1.2.`);
  if (g < 600) notes.push('Плотность ниже 600 кг/м³ — fB принята по крайней строке табл. Б.1 (600 кг/м³).');
  const R = BANDS.map((_,k) => { const i = I0 + k; return i <= iB ? RB : Math.min(65, RB + 2*(i - iB)); });
  const pts = [{n:'B', i:iB, R:RB}]; if (iC <= I0+15) pts.push({n:'C', i:iC, R:65});
  return {R, pts, steps, notes, method:'Однослойная массивная конструкция', clause:`${SPRK}, прил. Б, п. Б.1.2`};
}

// ---------- M2: тонкий лист, СП РК прил. Б.1.5, табл. Б.4 ----------
function thinABCD(s){
  const fB = s.a/s.h, fC = s.b/s.h, iB = bandIdx(fB), iC = bandIdx(fC);
  const f = i => i < iB ? s.RB - 1.5*(iB - i) : (i <= iC ? (iC === iB ? s.RB : s.RB + (s.RC - s.RB)*(i - iB)/(iC - iB)) : s.RC + 2.5*(i - iC));
  return {fB, fC, iB, iC, RB:s.RB, RC:s.RC, f};
}
function calcThin(s){
  const A = thinABCD(s), steps = [];
  steps.push(`Координаты точек B и C (${SPRK}, табл. Б.4, ${s.name}): fB = ${s.a}/${fmt(s.h,1)} = ${Math.round(A.fB)} Гц → ${nomOf(A.iB)} Гц, RB = ${fmt(s.RB)} дБ; fC = ${s.b}/${fmt(s.h,1)} = ${Math.round(A.fC)} Гц → ${nomOf(A.iC)} Гц, RC = ${fmt(s.RC)} дБ.`);
  steps.push('Отрезок AB — наклон 4,5 дБ на октаву, CD — 7,5 дБ на октаву (п. Б.1.5).');
  const R = BANDS.map((_,k) => r05(A.f(I0+k)));
  return {R, pts:[{n:'B',i:A.iB,R:A.RB},{n:'C',i:A.iC,R:A.RC}], steps, notes:[], method:'Однослойная тонкая конструкция', clause:`${SPRK}, прил. Б, п. Б.1.5`};
}

// ---------- M3/M4: две обшивки с промежутком, СП РК Б.1.6–Б.1.9 ----------
const TAB_B5 = [[1.4,2.0],[1.5,2.5],[1.6,3.0],[1.7,3.5],[1.8,4.0],[2.0,4.5],[2.2,5.0],[2.3,5.5],[2.5,6.0],[2.7,6.5],[2.9,7.0],[3.1,7.5],[3.4,8.0],[3.7,8.5],[4.0,9.0],[4.3,9.5],[4.6,10.0],[5.0,10.5]]; // табл. Б.5
const TAB_B6 = [[15,22],[25,22],[50,24],[100,26],[150,27],[200,28]]; // табл. Б.6
const TAB_B7 = [[0.2,2],[0.3,3],[0.4,4],[0.5,5],[1,5]];               // табл. Б.7 (пористо-волокнистый)
function calcDouble({leaf1, leaf2, dmm, wool}){
  const steps = [], notes = [], pts = [];
  const withP = [...leaf1, ...leaf2].filter(s => s.a);
  if (!withP.length) throw new Error('Ни у одного листа обшивки нет параметров табл. Б.4 — построить ABCD невозможно.');
  const ref = withP.reduce((a,b) => b.h > a.h ? b : a);
  const sig = l => l.map(s => s.id + ':' + s.h).sort().join('|');
  const equal = sig(leaf1) === sig(leaf2);
  const m1 = leaf1.reduce((a,s)=>a+s.m,0), m2 = leaf2.reduce((a,s)=>a+s.m,0);
  const mf = wool ? wool.m : 0, mob = m1 + m2 + mf;
  const d = dmm/1000;
  const A = thinABCD(ref);
  steps.push(`Обшивка 1: ${leaf1.map(s=>s.name+' '+fmt(s.h)+' мм').join(' + ')}; m1 = ${fmt(m1,2)} кг/м². Обшивка 2: ${leaf2.map(s=>s.name+' '+fmt(s.h)+' мм').join(' + ')}; m2 = ${fmt(m2,2)} кг/м². Воздушный промежуток d = ${fmt(dmm,0)} мм${wool ? `, заполнение — ${wool.name} ${fmt(wool.h,0)} мм, ${fmt(wool.m,2)} кг/м²` : ''}.`);
  steps.push(`Частотная характеристика одного листа (${ref.name}, h = ${fmt(ref.h)} мм) по табл. Б.4 — вспомогательная линия ABCD: fB = ${ref.a}/${fmt(ref.h)} = ${Math.round(A.fB)} Гц → ${nomOf(A.iB)} Гц, RB = ${fmt(A.RB)} дБ; fC = ${ref.b}/${fmt(ref.h)} = ${Math.round(A.fC)} Гц → ${nomOf(A.iC)} Гц, RC = ${fmt(A.RC)} дБ.`);
  const ratio = mob/ref.m; let dR1 = r05(interp(TAB_B5, ratio));
  steps.push(`Общая поверхностная плотность mобщ = ${fmt(mob,2)} кг/м²; mобщ/m(листа) = ${fmt(mob,2)}/${fmt(ref.m,2)} = ${fmt(ratio,2)} → по табл. Б.5 ΔR1 = ${fmt(dR1)} дБ${ratio>5?' (отношение больше 5,0 — принято крайнее значение таблицы)':''}${ratio<1.4?' (отношение меньше 1,4 — принято крайнее значение таблицы)':''}.`);
  let A1, iC2 = A.iC;
  if (equal){
    A1 = i => A.f(i) + dR1;
    steps.push(`Обшивки одинаковые: вспомогательная линия A1B1C1D1 = ABCD + ΔR1 (п. Б.1.6 а).`);
  } else {
    const thinRef = withP.reduce((a,b) => b.h < a.h ? b : a); iC2 = bandIdx(thinRef.b/thinRef.h);
    A1 = i => i <= A.iB ? A.f(i) + dR1 : (i <= iC2 ? A.RB + dR1 : A.RB + dR1 + 2.5*(i - iC2));
    steps.push(`Обшивки разные (п. Б.1.8): A1B1 = AB + ΔR1 до fB = ${nomOf(A.iB)} Гц, горизонталь B1C1 до fC2 = ${thinRef.b}/${fmt(thinRef.h)} → ${nomOf(iC2)} Гц, далее 7,5 дБ на октаву.`);
    if (Math.max(...withP.map(s=>s.h))/Math.min(...withP.map(s=>s.h)) > 2.5) notes.push('Соотношение толщин листов больше 2,5 — вне области п. Б.1.8.');
  }
  const fr = 60*Math.sqrt((m1+m2)/(d*m1*m2)); const ir = bandIdx(fr);
  steps.push(`Частота резонанса (ф. Б.5): fр = 60·√((m1+m2)/(d·m1·m2)) = 60·√((${fmt(m1,2)}+${fmt(m2,2)})/(${fmt(d,3)}·${fmt(m1,2)}·${fmt(m2,2)})) = ${fmt(fr,1)} Гц → ${nomOf(ir)} Гц.`);
  const RE = A1(ir-1), RF = A1(ir) - 4;
  steps.push(`Точка E на 0,8·fр = ${nomOf(ir-1)} Гц: RE = ${fmt(r05(RE))} дБ (совпадает с A1B1C1D1). Точка F на fр = ${nomOf(ir)} Гц: RF = ${fmt(A1(ir))} − 4 = ${fmt(RF)} дБ.`);
  pts.push({n:'E',i:ir-1,R:RE},{n:'F',i:ir,R:RF});
  const H = interp(TAB_B6, dmm); const iK = ir + 9, RK = RF + H;
  steps.push(`Точка K на 8·fр = ${nomOf(iK)} Гц: RK = RF + H = ${fmt(RF)} + ${fmt(H)} = ${fmt(RK)} дБ (H по табл. Б.6 при d = ${fmt(dmm,0)} мм${[15,25,50,100,150,200].includes(Math.round(dmm))?'':', по интерполяции'}).`);
  const FK = i => RF + (RK - RF)*(i - ir)/9;
  let RL; if (A.iB >= iK) RL = RK + 1.5*(A.iB - iK); else RL = FK(A.iB);
  const dR2 = RL - A1(A.iB);
  steps.push(A.iB >= iK
    ? `От K отрезок KL с наклоном 4,5 дБ на октаву до fB = ${nomOf(A.iB)} Гц: RL = ${fmt(RL)} дБ.`
    : `fB = ${nomOf(A.iB)} Гц < 8·fр: отрезок FK обрывается в точке L на fB, RL = ${fmt(RL)} дБ; точка K вспомогательная.`);
  steps.push(`Поправка на воздушный промежуток ΔR2 = RL − R(A1B1C1D1 на fB) = ${fmt(RL)} − ${fmt(A1(A.iB))} = ${fmt(dR2)} дБ.`);
  if (A.iB >= iK) pts.push({n:'K',i:iK,R:RK}); pts.push({n:'L',i:A.iB,R:RL});
  const nDouble = [leaf1, leaf2].filter(l => l.length >= 2).length;
  const dR3 = equal ? (nDouble === 2 ? 3 : nDouble === 1 ? 2 : 0) : 0;
  if (!equal && nDouble) notes.push('Для разных обшивок из нескольких листов поправка ΔR3 не учитывается (в запас).');
  let U;
  if (equal){
    const iM = A.iB + 1, iN = A.iC, RN = A1(A.iC) + dR2 + dR3;
    steps.push(`Горизонтальный отрезок LM до ${nomOf(iM)} Гц. Точка ${dR3?'S':'N'} на fC = ${nomOf(iN)} Гц: R = RC + ΔR1 + ΔR2${dR3?' + ΔR3':''} = ${fmt(A.RC)} + ${fmt(dR1)} + ${fmt(dR2)}${dR3?' + '+dR3:''} = ${fmt(RN)} дБ${dR3?` (ΔR3 = ${dR3} дБ — ${nDouble===2?'обе обшивки':'одна обшивка'} из двух листов, п. Б.1.7)`:''}; далее наклон 7,5 дБ на октаву.`);
    pts.push({n:'M',i:iM,R:RL},{n:dR3?'S':'N',i:iN,R:RN});
    U = i => {
      if (i <= ir - 1) return A1(i);
      if (i === ir) return RF;
      if (i <= Math.min(iK, A.iB)) return FK(i);
      if (i <= A.iB) return RK + 1.5*(i - iK);
      if (iN <= iM) return i <= iN ? RL : RN + 2.5*(i - iN);
      if (i <= iM) return RL;
      if (i <= iN) return RL + (RN - RL)*(i - iM)/(iN - iM);
      return RN + 2.5*(i - iN);
    };
  } else {
    steps.push(`Горизонтальный отрезок LM до fC2 = ${nomOf(iC2)} Гц, далее MN с наклоном 7,5 дБ на октаву (п. Б.1.8).`);
    pts.push({n:'M',i:iC2,R:RL});
    U = i => {
      if (i <= ir - 1) return A1(i);
      if (i === ir) return RF;
      if (i <= Math.min(iK, A.iB)) return FK(i);
      if (i <= A.iB) return RK + 1.5*(i - iK);
      if (i <= iC2) return RL;
      return RL + 2.5*(i - iC2);
    };
  }
  if (ir >= A.iB) notes.push('Частота резонанса не ниже fB — конструкция вне области применения п. Б.1.6.');
  let F = U, dR4 = 0;
  if (wool && wool.h > 0){
    const p = Math.min(1, wool.h/dmm);
    dR4 = p < 0.2 ? 0 : r05(interp(TAB_B7, p));
    const iQ = ir + 2; const RQ = (iQ <= A.iB ? FK(iQ) : U(iQ)) + dR4;
    if (dR4 > 0){
      steps.push(`Заполнение промежутка пористо-волокнистым материалом на ${Math.round(p*100)}% → ΔR4 = ${fmt(dR4)} дБ (табл. Б.7). Частота резонанса не меняется (п. Б.1.9). Точка Q на 1,6·fр = ${nomOf(iQ)} Гц: RQ = ${fmt(RQ - dR4)} + ${fmt(dR4)} = ${fmt(RQ)} дБ; далее характеристика параллельна незаполненному варианту, выше на ΔR4.`);
      pts.push({n:'Q',i:iQ,R:RQ});
      F = i => i <= ir ? U(i) : (i < iQ ? RF + (RQ - RF)*(i - ir)/(iQ - ir) : U(i) + dR4);
    } else notes.push('Заполнение менее 20% толщины промежутка — ΔR4 не учитывается (табл. Б.7).');
  }
  const R = BANDS.map((_,k) => r05(F(I0+k)));
  steps.push('Значения звукоизоляции округлены до 0,5 дБ.');
  return {R, pts, steps, notes, method: wool ? 'Каркасно-обшивная конструкция с заполнением промежутка' : 'Каркасно-обшивная конструкция с воздушным промежутком', clause:`${SPRK}, прил. Б, пп. Б.1.6–Б.1.9`};
}

// Табл. 18 Климухина (= табл. 12.5 Пособия): Lnw0 несущей плиты
const T18 = [[150,86],[200,84],[250,82],[300,80],[350,78],[400,77],[450,76],[500,75],[550,74],[600,73]];
function lnw0Of(m){
  if (m > 600) return {v: 73 - (m - 600)/50, note:`m1 = ${fmt(m,0)} кг/м² больше 600 — Lnw0 получен экстраполяцией табл. 18 (как в примере Пособия, m = 750 → 70 дБ).`};
  if (m < 150) return {v: 86, note:`m1 = ${fmt(m,0)} кг/м² меньше 150 — принято крайнее значение табл. 18 (86 дБ).`};
  return {v: interp(T18, m), note: T18.some(r=>r[0]===Math.round(m)) ? '' : 'по интерполяции'};
}
// значение строки таблицы при данной частоте (по полосам) и столбце (с интерполяцией/экстраполяцией)
function tabRow(tab, cols, x, fi, notes, label){
  const fIdx = tab.f.map(f => bandIdx(f));
  let i = fi;
  if (i < fIdx[0]) { notes.push(`${label}: частота ${nomOf(fi)} Гц ниже табличного диапазона — принято по ${tab.f[0]} Гц.`); i = fIdx[0]; }
  if (i > fIdx[fIdx.length-1]) { notes.push(`${label}: частота ${nomOf(fi)} Гц выше табличного диапазона — принято по ${tab.f[tab.f.length-1]} Гц; конструкция вне области таблицы.`); i = fIdx[fIdx.length-1]; }
  const colVal = (ri) => {
    const row = tab.v[ri];
    const valAt = c => { if (row[c] !== null) return row[c]; // пустая ячейка → ближайшая по частоте в том же столбце
      let best = null, bd = 99; tab.v.forEach((r,k)=>{ if (r[c]!==null && Math.abs(k-ri)<bd){bd=Math.abs(k-ri);best=r[c];} });
      notes.push(`${label}: ячейка таблицы пуста — принято ближайшее значение того же столбца.`); return best; };
    const asc = cols[0] < cols[1];
    const cs = cols.map((c,k)=>[c,k]); if (!asc) cs.reverse();
    if (x <= cs[0][0]) { if (x < cs[0][0]) notes.push(`${label}: значение ${fmt(x,1)} вне таблицы — принят крайний столбец.`); return valAt(cs[0][1]); }
    const last = cs[cs.length-1];
    if (x >= last[0]) {
      if (x > last[0]) { const prev = cs[cs.length-2]; const slope = (valAt(last[1]) - valAt(prev[1]))/(last[0]-prev[0]); notes.push(`${label}: значение ${fmt(x,1)} вне таблицы — экстраполяция по двум крайним столбцам.`); return valAt(last[1]) + slope*(x-last[0]); }
      return valAt(last[1]);
    }
    for (let k = 1; k < cs.length; k++) if (x <= cs[k][0]) { const a = cs[k-1], b = cs[k]; const va = valAt(a[1]), vb = valAt(b[1]); return va + (vb - va)*(x - a[0])/(b[0]-a[0]); }
  };
  let k = fIdx.findIndex(v => v >= i);
  if (fIdx[k] === i) return colVal(k);
  const a = colVal(k-1), b = colVal(k); return a + (b - a)*(i - fIdx[k-1])/(fIdx[k] - fIdx[k-1]);
}
function edAt(el, p, notes){
  const pts = el.E; // [[нагрузка Па, Ед Па, ε]]
  if (pts.length === 1 || p <= pts[0][0]) { if (p > pts[0][0]*1.05 && pts.length===1) notes.push(`${el.name}: Ед и ε известны только при ${pts[0][0]/1000} кПа, фактическая нагрузка ${fmt(p/1000,2)} кПа — приняты значения при ${pts[0][0]/1000} кПа.`); return {E: pts[0][1], eps: pts[0][2], interp:false}; }
  const n = pts.length; if (p >= pts[n-1][0]) { if (p > pts[n-1][0]) notes.push(`${el.name}: нагрузка ${fmt(p/1000,2)} кПа больше табличной ${pts[n-1][0]/1000} кПа — приняты значения при ${pts[n-1][0]/1000} кПа.`); return {E: pts[n-1][1], eps: pts[n-1][2], interp:false}; }
  for (let k = 1; k < n; k++) if (p <= pts[k][0]) { const t = (p - pts[k-1][0])/(pts[k][0]-pts[k-1][0]); return {E: pts[k-1][1] + t*(pts[k][1]-pts[k-1][1]), eps: pts[k-1][2] + t*(pts[k][2]-pts[k-1][2]), interp:true}; }
}

// plate — {m, g, hmm, K}; float — {elastic:[{mat,h}], m2, kind:'screed'|'sand'|'lags'} | null; roll — {name,dL}|null; ceil — 0/1/2
function calcFloor({plate, elastic, m2, above, roll, ceil, pUse}){
  const steps = [], notes = [], tabs = {}, stepsI = []; const stepsA = steps;
  const slab = calcMassive({...plate});
  const ix = indexRw(slab.R); const Rw0 = ix.Rw;
  steps.push(`Несущая плита: m1 = ${fmt(plate.m,1)} кг/м². Частотная характеристика плиты построена по ${SPRK}, п. Б.1.2; индекс изоляции плитой Rw0 = ${Rw0} дБ (п. 4.1.21).`);
  const L0 = lnw0Of(plate.m); let Lnw0 = L0.v; if (L0.note && L0.note !== 'по интерполяции') notes.push(L0.note);
  stepsI.push(`Индекс приведённого уровня ударного шума под плитой Lnw0 = ${fmt(Lnw0,1)} дБ (Климухин, табл. 18 = Пособие, табл. 12.5${L0.note==='по интерполяции'?', по интерполяции':''}).`);
  if (ceil){ const c = ceil === 2 ? 2 : 1; Lnw0 -= c; stepsI.push(`Подвесной потолок из листовых материалов${ceil===2?' с заполнением звукопоглотителем':''}: Lnw0 уменьшен на ${c} дБ (примечания к табл. 18) → ${fmt(Lnw0,1)} дБ.`); }
  let Rw, Lnw, fr = null, f0 = null, curveRw = null, curveLnw = null;
  if (elastic && elastic.length){
    const p = pUse + m2*10;
    steps.push(`Поверхностная плотность пола над звукоизоляционным слоем m2 = ${fmt(m2,1)} кг/м² (${above}). Нагрузка на звукоизоляционный слой p = ${pUse} + ${fmt(m2*10,0)} = ${fmt(p,0)} Па.`);
    let inv = 0; const parts = [];
    elastic.forEach(e => {
      const r = edAt(e.mat, p, notes); const d = e.h/1000*(1 - r.eps); inv += d/r.E;
      parts.push({e, r, d});
      steps.push(`${e.mat.name}: d0 = ${fmt(e.h,1)} мм, Ед = ${fmt(r.E/1e5,2)}·10⁵ Па, ε = ${fmt(r.eps,2)}${r.interp?' (по интерполяции по нагрузке)':''} (${e.mat.src}); толщина в обжатом состоянии d = d0·(1 − ε) = ${fmt(d*1000,2)} мм.`);
    });
    let Ed, d;
    if (parts.length === 1){ Ed = parts[0].r.E; d = parts[0].d; }
    else { d = parts.reduce((a,b)=>a+b.d,0); Ed = d/inv; steps.push(`Несколько упругих слоёв работают последовательно (Пособие, п. 12.12): эквивалентный Ед = Σd / Σ(d/Ед) = ${fmt(Ed/1e5,2)}·10⁵ Па при d = ${fmt(d*1000,2)} мм.`); notes.push('Несколько упругих слоёв: эквивалентная жёсткость принята как у последовательно соединённых слоёв — уточните по протоколу испытаний.'); }
    fr = 0.16*Math.sqrt(Ed*(plate.m + m2)/(d*plate.m*m2)); const ir = bandIdx(fr);
    f0 = 0.16*Math.sqrt(Ed/(d*m2)); const i0 = bandIdx(f0);
    steps.push(`Частота резонанса конструкции (Климухин, ф. 11): fр = 0,16·√(Ед·(m1+m2)/(d·m1·m2)) = ${fmt(fr,1)} Гц → ${nomOf(ir)} Гц.`);
    const kind = elastic.some(e => e.mat.sand) ? 'sand' : 'screed';
    const Erng = elastic.map(e=>edAt(e.mat,p,[]).E);
    if (kind === 'screed' && (Ed < 3e5 || Ed > 10e5)) notes.push(`Ед = ${fmt(Ed/1e5,2)}·10⁵ Па вне диапазона 3·10⁵–10·10⁵ Па строк табл. 15/17 — результат ориентировочный, окончательно — по протоколу испытаний.`);
    if (kind === 'screed' && (m2 < 60 || m2 > 120)) notes.push(`m2 = ${fmt(m2,0)} кг/м² вне диапазона 60–120 кг/м² строки табл. 15 — результат ориентировочный.`);
    const t15 = T15[kind]; const nl = [];
    let rw = tabRow(t15, T15_COLS, Math.min(Rw0, 57), ir, nl, 'Табл. 15');
    if (Rw0 > 57){ const at57 = rw; rw = Rw0 + Math.min(0, at57 - 57); notes.push(`Rw0 = ${Rw0} дБ больше 57 — табл. 15 экстраполирована без прироста от пола (в запас): Rw = Rw0 + min(0; R57 − 57).`); }
    if (Rw0 < 43) notes.push(`Rw0 = ${Rw0} дБ меньше 43 — принят крайний столбец табл. 15.`);
    nl.forEach(n=>notes.push(n));
    Rw = Math.floor(rw + 1e-9);
    steps.push(`По табл. 15 (Климухин; = табл. 10 Zvukoizol, СП 23-103-2003), строка «${kind==='sand'?'покрытие пола на стяжке по звукоизоляционному слою из песка':'покрытие пола на монолитной стяжке по звукоизоляционному слою с Ед = 3·10⁵–10·10⁵ Па'}», при Rw0 = ${Rw0} дБ и fр = ${nomOf(ir)} Гц: Rw = ${fmt(rw,2)} → ${Rw} дБ (округлено в запас).`);
    curveRw = {xs: t15.f, ys: t15.f.map(f => { const n=[]; const v = tabRow(t15, T15_COLS, Math.min(Rw0,57), bandIdx(f), n, ''); return Rw0>57 ? Rw0 + Math.min(0, v-57) : v; }), x: nomOf(ir), y: rw};
    stepsI.push(`Частота собственных колебаний пола (Климухин, ф. 13): f0 = 0,16·√(Ед/(d·m2)) = 0,16·√(${fmt(Ed,0)}/(${fmt(d,4)}·${fmt(m2,1)})) = ${fmt(f0,1)} Гц → ${nomOf(i0)} Гц.`);
    const rows = kind === 'sand' ? [['sand60',60],['sand120',120]] : [['m30',30],['m60',60],['m120',120]];
    const nl2 = [];
    const use = rows.filter((r,k) => (k < rows.length-1 && m2 <= rows[k+1][1] && (k===0 || m2 >= r[1])) || (k > 0 && m2 >= rows[k-1][1] && (k===rows.length-1 || m2 <= r[1])) || (m2 <= rows[0][1] && k===0) || (m2 >= rows[rows.length-1][1] && k===rows.length-1));
    const valFor = (fi, nn) => { const vals = use.map(([k,m]) => [m, tabRow(T17[k], T17_COLS, Lnw0, fi, nn, 'Табл. 17')]); return vals.length === 1 ? vals[0][1] : interp(vals, m2); };

    Lnw = Math.ceil(ln - 1e-9);
    stepsI.push(`По табл. 17 (Климухин; = табл. 12.7 Пособия, СП 23-103-2003) при Lnw0 = ${fmt(Lnw0,1)} дБ, f0 = ${nomOf(i0)} Гц и m2 = ${fmt(m2,1)} кг/м²${rows.some(r=>r[1]===Math.round(m2))?'':' (интерполяция по поверхностной плотности пола, примечание к табл.)'}: Lnw = ${fmt(ln,2)} → ${Lnw} дБ (округлено в запас).`);
    const fset = [...new Set(use.flatMap(([k]) => T17[k].f))].sort((a,b)=>a-b);
    curveLnw = {xs: fset, ys: fset.map(f => valFor(bandIdx(f), [])), x: nomOf(i0), y: ln};
    tabs.fr = fr; tabs.f0 = f0; tabs.Ed = Ed; tabs.d = d;
  } else if (roll){
    Rw = Rw0; Lnw = Math.ceil(Lnw0 - roll.dL - 1e-9);

  } else {
    Rw = Rw0; Lnw = Math.ceil(Lnw0 - 1e-9);
    steps.push(`Пол без звукоизоляционного слоя: Rw = Rw0 = ${Rw} дБ.`); stepsI.push(`Пол без звукоизоляционного слоя и без рулонного покрытия: Lnw = Lnw0 = ${Lnw} дБ.`);
  }
  return {Rw, Lnw, Rw0, Lnw0, slab, slabIx: ix, steps: stepsA, stepsI, notes, fr, f0, curveRw, curveLnw, tabs, method: elastic && elastic.length ? 'Перекрытие с полом на звукоизоляционном слое' : 'Перекрытие без звукоизоляционного слоя', clause:'Климухин А.А., табл. 15–18 (по СП 23-103-2003); Пособие к СП 51.13330, пп. 12.5–12.15'};
}

function findRule(bid, kind, a, b){
  const B = BUILD[bid]; if (!B || !a || !b) return null;
  return B.rules.find(r => r.k === kind && ((r.a.includes(a) && r.b.includes(b)) || (!r.dir && r.a.includes(b) && r.b.includes(a)))) || null;
}

// ---------- слой → параметры ----------
function lay(l){
  const m = MAT[l.id]; const h = m.fixH || l.h;
  const mass = m.mFix ? m.mFix : (m.g||0)*h/1000;
  return {...m, mat:m, h, m:mass};
}

// ---------- классификация стены ----------
function solveWall(layers){
  const L = layers.map(lay);
  if (!L.length) throw new Error('Добавьте хотя бы один слой.');
  const T = L.reduce((a,l)=>a+l.h,0);
  const zips = L.filter(l => l.type === 'zips');
  const solid = t => ['massive','thin'].includes(t);
  // группировка: листы/массив — «оболочки», воздух/вата — «промежутки»
  const groups = [];
  L.forEach(l => {
    const kind = solid(l.type) ? 'leaf' : (l.type === 'zips' ? 'zips' : 'gap');
    const g = groups[groups.length-1];
    if (g && g.kind === kind && kind !== 'zips') g.items.push(l); else groups.push({kind, items:[l]});
  });
  const info = {T, L};
  if (zips.length){
    const leaves = groups.filter(g=>g.kind==='leaf'), gaps = groups.filter(g=>g.kind==='gap');
    if (zips.length > 1 || gaps.length || leaves.length !== 1 || !leaves[0].items.some(l=>l.type==='massive'))
      throw new Error('Система ЗИПС рассчитывается только как облицовка одной массивной стены (стена ± штукатурка + ЗИПС с одной стороны). Других методик для такой комбинации в документах нет.');
    const base = massiveOf(leaves[0].items);
    const r = calcMassive(base.p);
    const z = zips[0];
    r.R = r.R.map((v,i) => v + z.dR[i]);
    r.steps = [...base.steps, ...r.steps, `Добавка звукоизоляции системой ${z.name} по полосам 100–3150 Гц: ΔR = ${z.dR.join('; ')} дБ (${z.src}). R(f) = R(стены) + ΔR(f).`];
    r.notes.push('Добавка ΔR(f) ЗИПС-Модуль измерена производителем на кирпичной стене 120 мм; для других стен результат ориентировочный.');
    r.method = 'Массивная стена с облицовкой ЗИПС-Модуль'; r.clause = 'СП РК 2.04-105-2012, п. Б.1.2 + протокол производителя (НИИСФ РААСН)';
    return {...r, ...info};
  }
  const leaves = groups.filter(g=>g.kind==='leaf'), gaps = groups.filter(g=>g.kind==='gap');
  if (groups[0].kind === 'gap' || groups[groups.length-1].kind === 'gap') throw new Error('Воздух или минвата не могут быть крайним слоем: снаружи должны быть обшивки или массивная стена.');
  if (leaves.length === 1){
    const items = leaves[0].items;
    if (items.some(l=>l.type==='massive')){
      const base = massiveOf(items); const r = calcMassive(base.p);
      r.steps = [...base.steps, ...r.steps]; r.notes = [...base.notes, ...r.notes];
      return {...r, ...info};
    }
    if (items.length === 1 && items[0].a){ const s = items[0]; return {...calcThin({...s, name:s.name}), ...info}; }
    throw new Error('Несколько склеенных листов без промежутка: в СП РК 2.04-105-2012 методики для такой конструкции нет. Разделите листы воздушным промежутком.');
  }
  if (leaves.length === 2 && gaps.length === 1){
    const [l1, l2] = leaves.map(g=>g.items);
    if ([...l1,...l2].some(l=>l.type==='massive'))
      throw new Error('Двойная стена с массивным слоем (или массив + облицовка на относе): в СП РК 2.04-105-2012 есть методика только для двух тонких обшивок с промежутком (пп. Б.1.6–Б.1.9). Для облицовки массивной стены используйте систему ЗИПС-Модуль.');
    if (l1.length > 2 || l2.length > 2) throw new Error('В обшивке больше двух листов: методика п. Б.1.7 охватывает обшивки из одного или двух листов.');
    const gap = gaps[0].items; const dmm = gap.reduce((a,l)=>a+l.h,0);
    const wools = gap.filter(l=>l.type==='wool');
    const wool = wools.length ? {name: wools.map(w=>w.name).join(' + '), h: wools.reduce((a,w)=>a+w.h,0), m: wools.reduce((a,w)=>a+w.m,0)} : null;
    const sh = l => ({id:l.id, name:l.name, a:l.a, b:l.b, RB:l.RB, RC:l.RC, h:l.h, m:l.m});
    const r = calcDouble({leaf1:l1.map(sh), leaf2:l2.map(sh), dmm, wool});
    if ([...l1,...l2].some(l=>l.mfr)) r.notes.push('Часть параметров — по данным производителя (см. источники).');
    return {...r, ...info};
  }
  throw new Error('Для такой комбинации слоёв в СП РК 2.04-105-2012 нет расчётной методики. Поддерживаются: однородная массивная стена (в т.ч. оштукатуренная); один тонкий лист; две обшивки (1–2 листа) с воздушным промежутком и/или минватой; массивная стена + ЗИПС-Модуль.');
}
function massiveOf(items){
  const ms = items.filter(l=>l.type==='massive'); const thin = items.filter(l=>l.type==='thin');
  const main = ms.reduce((a,b)=> (b.plaster && !a.plaster) ? a : (a.plaster && !b.plaster ? b : (b.m > a.m ? b : a)));
  const m = items.reduce((a,l)=>a+l.m,0), h = items.reduce((a,l)=>a+l.h,0);
  const steps = [], notes = [];
  if (items.length > 1){
    steps.push(`Слои жёстко связаны между собой — конструкция акустически однородная (Киселева Е.Г., МАРХИ, п. 6.1): ${items.map(l=>`${l.name} ${fmt(l.h)} мм (${fmt(l.m,1)} кг/м²)`).join(' + ')}. Суммарно h = ${fmt(h)} мм, m = ${fmt(m,1)} кг/м², средняя плотность ${fmt(m/h*1000,0)} кг/м³; коэффициент K принят по основному слою «${main.name}».`);
    notes.push('Многослойная однородная стена: fB определена по средней плотности и полной толщине, K — по основному слою.');
  }
  if (thin.length) notes.push('Приклеенные листы учтены только как дополнительная масса.');
  return {p:{m, g: m/h*1000, hmm:h, K:main.K}, steps, notes};
}

// ---------- классификация перекрытия (слои сверху вниз) ----------
function solveFloor(layers, pUse){
  const L = layers.map(lay);
  const T = L.reduce((a,l)=>a+l.h,0);
  const ceil = L.filter(l=>['ceil','ceilfill','ceilair'].includes(l.type));
  const body = L.filter(l=>!['ceil','ceilfill','ceilair'].includes(l.type));
  if (body.some(l=>['air','wool','zips'].includes(l.type) )) throw new Error('В перекрытии не используются воздушные промежутки и системы ЗИПС (кроме пространства подвесного потолка). Минвату под стяжкой выберите из группы «Звукоизоляционный слой».');
  if (body.some(l=>l.type==='thin' && !['lam'].includes(l.id))) throw new Error('Листовые материалы в перекрытии используйте как подвесной потолок (группа «Потолок снизу») или как покрытие пола.');
  const ei = body.map((l,i)=>l.type==='elastic'?i:-1).filter(i=>i>=0);
  let slabLayers, upper = [], elastic = [];
  if (ei.length){
    const first = ei[0], last = ei[ei.length-1];
    if (ei.some((v,k)=>k && v !== ei[k-1]+1)) throw new Error('Звукоизоляционные слои должны идти подряд.');
    upper = body.slice(0, first); elastic = body.slice(first, last+1); slabLayers = body.slice(last+1);
    if (!upper.length) throw new Error('Над звукоизоляционным слоем нет пола (стяжки или покрытия).');
  } else slabLayers = body;
  const massiveBelow = slabLayers.filter(l=>l.type==='massive');
  if (!massiveBelow.length) throw new Error('Нет несущей плиты перекрытия (железобетон, бетон…) под звукоизоляционным слоем.');
  const rolls = slabLayers.filter(l=>l.type==='roll');
  const mainSlab = massiveBelow.reduce((a,b)=> b.m > a.m ? b : a);
  const bonded = slabLayers.filter(l=>['massive','cover','roll'].includes(l.type));
  const m1 = bonded.reduce((a,l)=>a+l.m,0), h1 = bonded.filter(l=>l.type==='massive').reduce((a,l)=>a+l.h,0);
  const m1s = massiveBelow.reduce((a,l)=>a+l.m,0);
  const plate = {m:m1s, g:m1s/h1*1000, hmm:h1, K:mainSlab.K};
  const m2 = upper.reduce((a,l)=>a+l.m,0);
  const above = upper.map(l=>`${l.name} ${fmt(l.h)} мм — ${fmt(l.m,1)} кг/м²`).join('; ');
  const cflag = ceil.some(l=>l.type==='ceil') ? (ceil.some(l=>l.type==='ceilfill') ? 2 : 1) : 0;
  const r = calcFloor({plate, elastic: elastic.map(l=>({mat:l.mat, h:l.h})), m2, above, roll: rolls.length && !elastic.length ? {name:rolls[0].name, dL:rolls[0].dL} : null, ceil:cflag, pUse});
  if (massiveBelow.length > 1) r.steps.unshift(`Несущая часть: ${massiveBelow.map(l=>`${l.name} ${fmt(l.h)} мм`).join(' + ')} (жёстко связаны), m1 = ${fmt(m1s,1)} кг/м².`);
  if (rolls.length && elastic.length) r.notes.push('Рулонное покрытие над звукоизоляционным слоем учтено только как масса пола.');
  return {...r, T, L};
}

function chartR(R, ix, pts, opt={}){
  const W = 760, H = 380, ml = 52, mr = 18, mt = 22, mb = 46;
  const all = [...R, ...ix.shifted, ...CURVE_R];
  const ymin = Math.floor((Math.min(...all) - 4)/10)*10, ymax = Math.ceil((Math.max(...all) + 4)/10)*10;
  const X = k => ml + k*(W-ml-mr)/15, Y = v => mt + (ymax - v)*(H-mt-mb)/(ymax - ymin);
  const F = opt.font || 'Inter, Arial, sans-serif';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${F}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for (let v = ymin; v <= ymax; v += 5) s += `<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v%10?'#f0f0f0':'#e2e2e2'}"/>${v%10?'':`<text x="${ml-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#5f5f5f">${v}</text>`}`;
  BANDS.forEach((f,k) => s += `<line x1="${X(k)}" x2="${X(k)}" y1="${mt}" y2="${H-mb}" stroke="#f3f3f3"/><text x="${X(k)}" y="${H-mb+16}" font-size="11" text-anchor="middle" fill="#5f5f5f">${f}</text>`);
  s += `<text x="${W/2}" y="${H-8}" font-size="12" text-anchor="middle" fill="#111">Частота, Гц (1/3 октавы)</text><text x="14" y="${H/2}" font-size="12" text-anchor="middle" fill="#111" transform="rotate(-90 14 ${H/2})">R, дБ</text>`;
  // заливка недобора
  R.forEach((r,k) => { if (ix.dev[k] > 0){ const x0 = X(Math.max(0,k-0.5)), x1 = X(Math.min(15,k+0.5)); s += `<rect x="${x0}" y="${Y(ix.shifted[k])}" width="${x1-x0}" height="${Y(r)-Y(ix.shifted[k])}" fill="#FF5E00" opacity=".13"/>`; }});
  const path = arr => arr.map((v,k)=>`${k?'L':'M'}${X(k).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  s += `<path d="${path(CURVE_R)}" fill="none" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  s += `<path d="${path(ix.shifted)}" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="7 5"/>`;
  s += `<path d="${path(R)}" fill="none" stroke="#FF5E00" stroke-width="3.2" stroke-linejoin="round"/>`;
  R.forEach((v,k) => s += `<circle cx="${X(k)}" cy="${Y(v)}" r="3.4" fill="#FF5E00"/>`);
  (pts||[]).forEach(p => { const k = p.i - I0; if (k < -0.01 || k > 15.01) return; s += `<g><circle cx="${X(k)}" cy="${Y(p.R)}" r="5" fill="#fff" stroke="#1f4fff" stroke-width="2"/><text x="${X(k)+7}" y="${Y(p.R)-8}" font-size="13" font-weight="700" fill="#1f4fff">${p.n}${opt.coords?` (${nomOf(p.i)}; ${fmt(p.R)})`:''}</text></g>`; });
  const k5 = 7; s += `<line x1="${X(k5)}" x2="${X(k5)}" y1="${Y(ix.shifted[k5])}" y2="${H-mb}" stroke="#111" stroke-dasharray="2 3"/><rect x="${X(k5)-32}" y="${Y(ix.shifted[k5])-30}" width="64" height="20" fill="#111"/><text x="${X(k5)}" y="${Y(ix.shifted[k5])-16}" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Rw = ${ix.Rw}</text>`;
  // легенда
  const lg = [['#FF5E00','Расчётная R(f)',''],['#111','Оценочная кривая, сдвиг '+(ix.s>0?'+':'')+ix.s+' дБ','7 5'],['#bdbdbd','Оценочная кривая (табл. 4)','2 4']];
  lg.forEach((l,i) => { const lx = ml + 10 + i*230; s += `<line x1="${lx}" x2="${lx+26}" y1="${mt+10}" y2="${mt+10}" stroke="${l[0]}" stroke-width="3" ${l[2]?`stroke-dasharray="${l[2]}"`:''}/><text x="${lx+32}" y="${mt+14}" font-size="12" fill="#111">${l[1]}</text>`; });
  return s + '</svg>';
}
function chartTab(c, opt){ // c: {xs, ys, x, y}; opt: {ylab, req, better:'up'|'down', title, tag}

  for (let i = Math.ceil(xmin); i <= xmax; i++) s += `<text x="${X(i)}" y="${H-mb+16}" font-size="11" text-anchor="middle" fill="#5f5f5f">${NOM[i]}</text><line x1="${X(i)}" x2="${X(i)}" y1="${mt}" y2="${H-mb}" stroke="#f3f3f3"/>`;

  }
  s += `<path d="${c.xs.map((f,k)=>`${k?'L':'M'}${X(xi[k]).toFixed(1)} ${Y(c.ys[k]).toFixed(1)}`).join(' ')}" fill="none" stroke="#111" stroke-width="2.2"/>`;
  c.xs.forEach((f,k)=> s += `<circle cx="${X(xi[k])}" cy="${Y(c.ys[k])}" r="3" fill="#111"/>`);
  s += `<line x1="${X(xm)}" x2="${X(xm)}" y1="${Y(c.y)}" y2="${H-mb}" stroke="#FF5E00" stroke-dasharray="3 3"/><circle cx="${X(xm)}" cy="${Y(c.y)}" r="7" fill="#FF5E00"/><text x="${X(xm)+10}" y="${Y(c.y)-10}" font-size="13" font-weight="700" fill="#FF5E00">${opt.mark}</text>`;
  s += `<text x="${ml}" y="18" font-size="12" fill="#5f5f5f">${opt.title}</text>`;
  return s + '</svg>';
}

async function pbkdf2(pass){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:new TextEncoder().encode(ADMIN_PBKDF2.salt), iterations:ADMIN_PBKDF2.it}, key, 256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// защита от перебора: после 5 ошибок — пауза, растущая с каждой серией
function guardCheck(kind){ const until = +LS.get('zvuk-lock-'+kind, 0); const left = until - Date.now(); return left > 0 ? Math.ceil(left/60000) : 0; }
function guardFail(kind){ const n = +LS.get('zvuk-fail-'+kind, 0) + 1; LS.set('zvuk-fail-'+kind, n); if (n % 5 === 0){ const mins = Math.min(60, 5 * Math.pow(2, n/5 - 1)); LS.set('zvuk-lock-'+kind, Date.now() + mins*60000); } }
function guardOk(kind){ LS.set('zvuk-fail-'+kind, 0); LS.set('zvuk-lock-'+kind, 0); }

// --- SVG → PNG ---
function svgToPng(svg, w, h){
  return new Promise((res, rej) => {
    const img = new Image(); const k = 2;
    img.onload = () => { try { const c = document.createElement('canvas'); c.width = w*k; c.height = h*k; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/png'); const bin = atob(url.split(',')[1]); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); res({url, bytes:u}); } catch(e){ rej(e); } };
    img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

// --- минимальный ZIP (без сжатия) ---
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i=0;i<u.length;i++) c = CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zip(files){ // [{name, data:Uint8Array|string}]
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((a,b)=>a+b.length,0);
  const end = new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

const xe = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const run = (t, o={}) => `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
const para = (t, o={}) => `<w:p><w:pPr><w:spacing w:after="${o.after??80}" w:line="264" w:lineRule="auto"/>${o.center?'<w:jc w:val="center"/>':''}</w:pPr>${run(t,o)}</w:p>`;
function tbl(head, rows, small){
  const sz = small ? 14 : 20; const n = head.length; const total = 10200; const first = small ? 2600 : Math.round(total/n);
  const w = i => small ? (i===0 ? first : Math.floor((total-first)/(n-1))) : Math.floor(total/n);
  const cell = (t,i,h) => `<w:tc><w:tcPr><w:tcW w:w="${w(i)}" w:type="dxa"/>${h?'<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>':''}<w:tcMar><w:left w:w="40" w:type="dxa"/><w:right w:w="40" w:type="dxa"/></w:tcMar></w:tcPr><w:p><w:pPr><w:spacing w:after="0"/>${i?'<w:jc w:val="center"/>':''}</w:pPr>${run(t,{sz, b:h})}</w:p></w:tc>`;
  const B = '<w:tblBorders>' + ['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="808080"/>`).join('') + '</w:tblBorders>';
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${B}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${head.map((_,i)=>`<w:gridCol w:w="${w(i)}"/>`).join('')}</w:tblGrid><w:tr>${head.map((t,i)=>cell(t,i,true)).join('')}</w:tr>${rows.map(r=>`<w:tr>${r.map((t,i)=>cell(t,i,false)).join('')}</w:tr>`).join('')}</w:tbl>${para('',{after:60})}`;
}
const drawing = (rid, id, cx, cy) => `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Рисунок ${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="chart${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
async function toDocx(blocks){
  let body = '', imgs = [], n = 0;
  for (const b of blocks){
    if (b.t === 'title'){ body += para('РАСЧЁТ ЗВУКОИЗОЛЯЦИИ ОГРАЖДАЮЩИХ КОНСТРУКЦИЙ', {b:true, sz:28, center:true, after:60}) + para(b.text, {b:true, sz:24, center:true, after:40}) + (b.sub?para(b.sub,{sz:20,center:true,after:200}):''); }
    else if (b.t === 'h') body += para(b.text, {b:true, sz:24, after:120});
    else if (b.t === 'p') body += para(b.text, {b:b.b});
    else if (b.t === 'table') body += tbl(b.head, b.rows, b.small);
    else if (b.t === 'img'){
      try { const png = await svgToPng(b.svg, b.w, b.h); n++; imgs.push(png.bytes); const cx = 6120000, cy = Math.round(cx*b.h/b.w); body += drawing('rIdImg'+n, n, cx, cy); }
      catch(e){ body += para('[график не удалось встроить в этом браузере]', {i:true}); }
    }
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="850" w:bottom="1000" w:left="850" w:header="400" w:footer="400" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imgs.map((_,i)=>`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.png"/>`).join('')}</Relationships>`;
  const files = [
    {name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`},
    {name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`},
    {name:'word/document.xml', data:doc},
    {name:'word/_rels/document.xml.rels', data:rels},
    ...imgs.map((u,i)=>({name:`word/media/image${i+1}.png`, data:u}))
  ];
  return zip(files);
}

// --- PDF: свой рендер на canvas (A4) + минимальный PDF с JPEG-страницами ---
async function toPdf(blocks){
  const K = 2, PW = 794, PH = 1123, M = 48, CW = PW - 2*M;
  const pages = []; let cv, g, y;
  const newPage = () => { cv = document.createElement('canvas'); cv.width = PW*K; cv.height = PH*K; g = cv.getContext('2d'); g.scale(K,K); g.fillStyle = '#fff'; g.fillRect(0,0,PW,PH); g.textBaseline = 'top'; pages.push(cv); y = M; };
  const font = (sz, b) => g.font = `${b?'bold ':''}${sz}px Arial, Helvetica, sans-serif`;
  const wrap = (t, w) => { const words = String(t).split(' '); const lines = []; let cur = '';
    words.forEach(wd => { const test = cur ? cur + ' ' + wd : wd; if (g.measureText(test).width > w && cur){ lines.push(cur); cur = wd; } else cur = test; }); if (cur) lines.push(cur); return lines.length ? lines : ['']; };
  const ensure = h => { if (y + h > PH - M) newPage(); };
  const text = (t, sz, b, align='left', gap=4) => { font(sz, b); const lh = sz*1.32; wrap(t, CW).forEach(l => { ensure(lh); g.fillStyle = '#111'; g.textAlign = align; g.fillText(l, align==='center' ? PW/2 : M, y); y += lh; }); g.textAlign = 'left'; y += gap; };
  newPage();
  for (const b of blocks){
    if (b.t === 'title'){ text('РАСЧЁТ ЗВУКОИЗОЛЯЦИИ ОГРАЖДАЮЩИХ КОНСТРУКЦИЙ', 15, true, 'center', 2); text(b.text, 13, true, 'center', 2); if (b.sub) text(b.sub, 11, false, 'center', 12); }
    else if (b.t === 'h'){ y += 6; text(b.text, 13, true); }
    else if (b.t === 'p') text(b.text, 11, b.b, 'left', 3);
    else if (b.t === 'table'){
      const sz = b.small ? 7.5 : 10, n = b.head.length; const w0 = b.small ? 150 : CW/n, wi = b.small ? (CW - w0)/(n - 1) : CW/n;
      const cw = i => i === 0 ? w0 : wi, cx = i => M + (i === 0 ? 0 : w0 + (i-1)*wi);
      const row = (cells, head) => { font(sz, head); const lh = sz*1.25; const ls = cells.map((c,i) => wrap(c, cw(i) - 4)); const h = Math.max(...ls.map(l=>l.length))*lh + 4;
        ensure(h); cells.forEach((c,i) => { if (head){ g.fillStyle = '#f2f2f2'; g.fillRect(cx(i), y, cw(i), h); } g.strokeStyle = '#888'; g.lineWidth = 0.6; g.strokeRect(cx(i), y, cw(i), h); g.fillStyle = '#111';
          ls[i].forEach((l,k) => { g.textAlign = i ? 'center' : 'left'; g.fillText(l, i ? cx(i) + cw(i)/2 : cx(i) + 2, y + 2 + k*lh); }); }); g.textAlign = 'left'; y += h; };
      row(b.head, true); b.rows.forEach(r => row(r, false)); y += 8;
    }
    else if (b.t === 'img'){
      try { const p = await svgToPng(b.svg, b.w, b.h); const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = p.url; });
        const h = CW*b.h/b.w; ensure(h + 6); g.drawImage(im, M, y, CW, h); y += h + 8; }
      catch(e){ text('[график не удалось вставить в этом браузере]', 10, false); }
    }
  }
  // сборка PDF
  const enc = new TextEncoder(); const chunks = []; const offs = []; let pos = 0;
  const add = d => { const u = typeof d === 'string' ? enc.encode(d) : d; chunks.push(u); pos += u.length; };
  const jpgs = pages.map(c => { const b64 = c.toDataURL('image/jpeg', 0.9).split(',')[1]; const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; });
  const N = pages.length; // объекты: 1 каталог, 2 pages, далее на страницу: page, contents, image
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (id, body) => { offs[id] = pos; add(`${id} 0 obj\n`); body(); add('\nendobj\n'); };
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add(`<< /Type /Pages /Count ${N} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`));
  pages.forEach((c,i) => {
    const pid = 3+i*3, cid = pid+1, iid = pid+2; const W = 595.28, H = 841.89;
    obj(pid, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(cid, () => { add(`<< /Length ${cs.length} >>\nstream\n`); add(cs); add('\nendstream'); });
    obj(iid, () => { add(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgs[i].length} >>\nstream\n`); add(jpgs[i]); add('\nendstream'); });
  });
  const total = 3 + N*3; const xref = pos;
  add(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) add(String(offs[i]).padStart(10,'0') + ' 00000 n \n');
  add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, {type:'application/pdf'});
}
async function makeReport(fmtName){
  const msg = $('#repmsg'); msg.textContent = 'Готовлю отчёт…';
  try {
    const blocks = buildReport();
    const blob = fmtName === 'docx' ? await toDocx(blocks) : await toPdf(blocks);
    const fname = `Расчет звукоизоляции ${st.view==='wall'?'стены':'перекрытия'}.${fmtName}`;
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({filename: fname, data: blob}); msg.textContent = 'Готово.'; }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click(); msg.textContent = 'Файл сформирован.'; }
  } catch(e){ msg.textContent = (e && e.code === 'declined') ? 'Скачивание отменено.' : 'Не удалось сформировать отчёт: ' + (e.message || e.code || e); }
}
